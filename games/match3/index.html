<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match-3 Secured Sandbox Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
    
    :root {
      --bg-color: #05070c;
      --panel-bg: rgba(17, 24, 39, 0.85);
      --glow-pink: #ff007f;
      --glow-cyan: #00f0ff;
      --glow-gold: #ffea00;
      --text-color: #f3f4f6;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    /* Cyber background pattern */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 0, 127, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .game-layout {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 2rem;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      max-width: 90%;
      align-items: center;
    }

    .game-info {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-width: 200px;
    }

    .info-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1rem;
      text-align: center;
    }

    .info-box h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9ca3af;
      margin-bottom: 0.3rem;
    }

    .info-box .value {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .info-box .value.cyan {
      background: linear-gradient(90deg, var(--glow-cyan), #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .info-box .value.gold {
      background: linear-gradient(90deg, var(--glow-gold), #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .canvas-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
    }

    canvas {
      display: block;
      background-color: rgba(5, 7, 12, 0.9);
      cursor: pointer;
    }

    .instructions {
      font-size: 0.85rem;
      color: #9ca3af;
      text-align: center;
      line-height: 1.5;
    }

    .hud-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--glow-pink), var(--glow-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    /* Secret token display for transparency */
    .token-display {
      font-family: monospace;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.2);
      text-align: center;
      margin-top: 1rem;
      word-break: break-all;
      max-width: 200px;
    }
  </style>
</head>
<body>
  <div class="game-layout">
    
    <div class="game-info">
      <div>
        <h2 class="hud-title">CRYSTAL MATCH</h2>
        <p class="instructions">Збирайте разом 3 або більше однакових кристалів для видобутку золота та сапфірів!</p>
      </div>

      <div class="info-box">
        <h3>Очки</h3>
        <div id="score-val" class="value cyan">0</div>
      </div>

      <div class="info-box">
        <h3>Здобуте Золото</h3>
        <div id="gold-val" class="value gold">0</div>
      </div>

      <div class="instructions">
        Клікніть на кристал та сусідній кристал, щоб поміняти їх місцями.
      </div>

      <button id="claim-btn" style="background: linear-gradient(90deg, var(--glow-cyan), var(--glow-pink)); border: none; color: #fff; padding: 0.8rem 1.2rem; border-radius: 12px; font-weight: 800; font-size: 0.95rem; cursor: pointer; text-shadow: 0 0 10px rgba(0,240,255,0.4); box-shadow: 0 4px 15px rgba(0,240,255,0.2); transition: all 0.3s ease; width: 100%;">
        📥 Клеймити та зберегти
      </button>
      
      <div id="token-box" class="token-display">
        Token: Loading...
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="match3-canvas" width="400" height="400"></canvas>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
